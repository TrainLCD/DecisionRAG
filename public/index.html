<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="TrainLCDのIssue、プルリクエスト、ドキュメント、利用者の報告を横断検索。">
  <title>TrainLCD DecisionRAG</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
<header class="app-header">
  <div class="shell header-inner">
    <h1>TrainLCD DecisionRAG</h1>
    <button id="settings-button" class="menu-button" type="button" aria-haspopup="dialog" aria-controls="settings-dialog">
      <span class="sr-only">利用キー・同期設定</span>
      <span id="connection-state" class="badge">公開資料のみ</span>
    </button>
  </div>
</header>

<main id="workspace" tabindex="-1">
  <div class="shell workspace-inner">
    <div class="workspace-heading">
      <h2>検索結果</h2>
      <p>TrainLCDの公開Issue、プルリクエスト、ドキュメントを検索できます。</p>
    </div>
    <p id="notice" class="notice" role="status" aria-live="polite"></p>
    <section id="results" class="surface" aria-label="検索結果" aria-busy="false">
      <div id="empty-state" class="empty-state">
        <span class="empty-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg>
        </span>
        <p>質問やキーワードで資料を探せます</p>
        <p class="muted">検索結果はここに表示されます。</p>
      </div>
      <div id="result-summary" hidden></div>
      <section id="answer-panel" class="answer-panel" hidden></section>
      <nav id="pagination-top" class="result-pagination" aria-label="検索結果のページ切り替え（上部）" hidden>
        <button type="button" data-page-step="-1" aria-controls="evidence-list" disabled>前へ</button>
        <span data-page-label class="page-position" role="status" aria-live="polite"></span>
        <button type="button" data-page-step="1" aria-controls="evidence-list" disabled>次へ</button>
      </nav>
      <div id="evidence-list" role="group" tabindex="-1" aria-label="このページの検索結果"></div>
      <nav id="pagination-bottom" class="result-pagination" aria-label="検索結果のページ切り替え（下部）" hidden>
        <button type="button" data-page-step="-1" aria-controls="evidence-list" disabled>前へ</button>
        <span data-page-label class="page-position"></span>
        <button type="button" data-page-step="1" aria-controls="evidence-list" disabled>次へ</button>
      </nav>
      <details id="trace-panel" hidden>
        <summary>検索処理の内訳（詳細）</summary>
        <div id="trace-list"></div>
      </details>
    </section>
  </div>
</main>

<footer class="search-dock">
  <form id="search-form" class="shell">
    <div class="query-field">
      <label for="query">質問・キーワード</label>
      <textarea id="query" aria-describedby="query-count" maxlength="1500" rows="2" placeholder="例：地下鉄で位置更新が止まる問題" required></textarea>
      <div class="query-actions">
        <div class="query-options" role="group" aria-label="検索オプション">
          <label class="query-option" title="要約を含める">
            <input id="include-summary" class="sr-only" type="checkbox" aria-label="要約を含める" checked>
            <span class="query-option-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6m-6 4h6m-6 4h3"/></svg>
            </span>
          </label>
          <label class="query-option" title="フィードバックを含める（利用キーが必要）">
            <input id="include-feedback" class="sr-only" type="checkbox" aria-label="フィードバックを含める（利用キーが必要）">
            <span class="query-option-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 15a2 2 0 0 1-2 2H9l-5 4V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2Z"/><path d="M8 9h8m-8 4h5"/></svg>
            </span>
          </label>
        </div>
        <button id="search-button" class="primary" type="submit" aria-label="検索" title="検索">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>
        </button>
      </div>
    </div>
    <span id="query-count" class="muted">0 / 1,500文字</span>
  </form>
</footer>

<dialog id="settings-dialog" aria-labelledby="settings-title">
  <div class="dialog-header">
    <h2 id="settings-title">利用キー・同期設定</h2>
    <form method="dialog">
      <button class="icon-button" type="submit" aria-label="閉じる">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg>
      </button>
    </form>
  </div>
  <div class="dialog-content">
    <section class="connection" aria-label="APIへの接続">
      <form id="connect-form">
        <label for="token">利用キー <code>API_TOKEN</code></label>
        <div class="connection-row">
          <input id="token" type="password" autocomplete="off" spellcheck="false" aria-describedby="token-help" required>
          <button id="connect-button" class="primary" type="submit">接続</button>
        </div>
      </form>
      <button id="disconnect-button" type="button" hidden>接続を解除</button>
      <p id="token-help" class="muted">フィードバック検索と同期操作に使います。キーはブラウザーのメモリに保持し、再読み込みすると消去されます。</p>
    </section>
    <p id="settings-notice" class="notice" role="status" aria-live="polite"></p>
    <section class="sync-settings" aria-labelledby="sync-title">
      <h3 id="sync-title">同期状況</h3>
      <dl class="sync-counts">
        <div><dt>対象リポジトリ数</dt><dd id="repo-count">—</dd></div>
        <div><dt>登録済み資料数</dt><dd id="source-count">—</dd></div>
      </dl>
      <p id="sync-summary" class="muted">接続後に表示します。</p>
      <div class="actions">
        <button id="refresh-button" type="button" disabled>状況を確認</button>
        <button id="sync-button" class="soft-button" type="button" disabled>GitHubから取り込む</button>
      </div>
      <p id="sync-updated" class="muted"></p>
      <details id="sync-errors" hidden><summary>同期エラーの履歴</summary><div id="sync-error-list"></div></details>
    </section>
  </div>
</dialog>
</body>
</html>
