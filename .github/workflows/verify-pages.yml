name: Verify paged retrieval before PR
on:
  push:
    branches: [perf/paged-retrieval]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:pwa && npm run check && npm test
      - run: node scripts/prepare-preview.mjs
        env:
          DECISIONRAG_D1_DATABASE_ID: ${{ vars.DECISIONRAG_D1_DATABASE_ID }}
      - name: Upload flash preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler versions upload --config wrangler.preview.json --strict --tag paged-flash --preview-alias paged-flash
      - name: Prepare Clef comparison
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('wrangler.preview.json')); c.main='src/preview-clef.ts'; fs.writeFileSync('wrangler.preview.json',JSON.stringify(c));"
      - name: Upload Clef preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler versions upload --config wrangler.preview.json --strict --tag paged-clef --preview-alias paged-clef
