name: Verify search latency before PR
on:
  push:
    branches: [perf/clef-title-concurrency]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:pwa && npm run check && npm test
      - run: node scripts/prepare-preview.mjs
        env:
          DECISIONRAG_D1_DATABASE_ID: ${{ vars.DECISIONRAG_D1_DATABASE_ID }}
      - name: Upload read-only verification version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler versions upload --config wrangler.preview.json --strict --tag latency-verification --preview-alias latency-verification
