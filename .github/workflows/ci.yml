name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx wrangler d1 migrations apply trainlcd-decision-rag --local
      - run: npx wrangler deploy --dry-run --outdir dist

  deploy:
    name: Deploy to production
    needs: check
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && vars.DECISIONRAG_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: decisionrag-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare production Wrangler config
        env:
          DECISIONRAG_D1_DATABASE_ID: ${{ vars.DECISIONRAG_D1_DATABASE_ID }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';

          const id = process.env.DECISIONRAG_D1_DATABASE_ID ?? '';
          if (!/^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(id) || id === '00000000-0000-0000-0000-000000000000') {
            throw new Error('Set DECISIONRAG_D1_DATABASE_ID to the existing production D1 database ID.');
          }
          const config = JSON.parse(readFileSync('wrangler.jsonc', 'utf8'));
          const database = config.d1_databases.find(({ binding }) => binding === 'DB');
          database.database_id = id;
          config.workers_dev = true;
          config.keep_vars = true;
          delete config.vars;
          writeFileSync('wrangler.production.json', JSON.stringify(config));
          JS
      - name: Check default branch head
        id: head
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy Worker
        if: steps.head.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set the production CLOUDFLARE_API_TOKEN secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the production CLOUDFLARE_ACCOUNT_ID secret}"
          npx --no-install wrangler deploy --config wrangler.production.json --strict
