name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx wrangler d1 migrations apply trainlcd-decision-rag --local
      - run: npx wrangler deploy --dry-run --outdir dist

  deploy:
    name: Deploy to production
    needs: check
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch &&
      vars.DECISIONRAG_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: decisionrag-production
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare production Wrangler config
        env:
          DECISIONRAG_D1_DATABASE_ID: ${{ vars.DECISIONRAG_D1_DATABASE_ID }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';

          const id = process.env.DECISIONRAG_D1_DATABASE_ID ?? '';
          if (!/^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(id) || id === '00000000-0000-0000-0000-000000000000') {
            throw new Error('Set DECISIONRAG_D1_DATABASE_ID to the existing production D1 database ID.');
          }
          const config = JSON.parse(readFileSync('wrangler.jsonc', 'utf8'));
          const database = config.d1_databases.find(({ binding }) => binding === 'DB');
          database.database_id = id;
          config.keep_vars = true;
          delete config.vars;
          writeFileSync('wrangler.production.json', JSON.stringify(config));
          JS
      - name: Check default branch head
        id: head
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping deploy of $GITHUB_SHA because the head of $DEFAULT_BRANCH is $latest."
          fi
      - name: Deploy Worker
        if: steps.head.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set the production CLOUDFLARE_API_TOKEN secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the production CLOUDFLARE_ACCOUNT_ID secret}"
          output=$(mktemp)
          trap 'rm -f "$output"' EXIT
          WRANGLER_OUTPUT_FILE_PATH="$output" npx --no-install wrangler versions upload \
            --config wrangler.production.json --strict --tag "$GITHUB_SHA"
          version_id=$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const records = readFileSync(process.argv[1], "utf8").trim().split("\n").map(line => JSON.parse(line));
            const uploaded = records.find(record => record.type === "version-upload");
            if (!uploaded?.version_id) throw new Error("Wrangler did not report an uploaded version.");
            console.log(uploaded.version_id);
          ' "$output")
          latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "::notice::Skipping deploy of $GITHUB_SHA because the head of $DEFAULT_BRANCH is $latest."
            exit 0
          fi
          npx --no-install wrangler versions deploy "${version_id}@100%" \
            --config wrangler.production.json --message "Deploy $GITHUB_SHA" --yes
