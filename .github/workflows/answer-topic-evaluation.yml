name: Answer topic evaluation
on:
  workflow_dispatch:
  push:
    paths:
      - backend/src/instructions.txt
      - backend/src/writingGuide.txt
      - scripts/evaluate-answer-topic.mjs
      - test/fixtures/answer-topic/**
      - .github/workflows/answer-topic-evaluation.yml
permissions:
  contents: read
jobs:
  evaluate:
    if: vars.DECISIONRAG_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compare baseline and candidate on fixed evidence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/evaluate-answer-topic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: answer-topic-evaluation
          path: test-results/answer-topic.json
